services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sika
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: sika
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sika"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    environment:
      - DATABASE_URL=postgresql://sika:${POSTGRES_PASSWORD:-localdev}@db:5432/sika
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  sika:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://sika:${POSTGRES_PASSWORD:-localdev}@db:5432/sika
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SIKA_SETUP_TOKEN=${SIKA_SETUP_TOKEN}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - WEB_PUSH_VAPID_PUBLIC_KEY=${WEB_PUSH_VAPID_PUBLIC_KEY}
      - WEB_PUSH_VAPID_PRIVATE_KEY=${WEB_PUSH_VAPID_PRIVATE_KEY}
      - WEB_PUSH_VAPID_SUBJECT=${WEB_PUSH_VAPID_SUBJECT}
      - NOTIFICATION_DISPATCH_TOKEN=${NOTIFICATION_DISPATCH_TOKEN}
      - BACKUP_REPORT_TOKEN=${BACKUP_REPORT_TOKEN}
      - SMTP_URL=${SMTP_URL}
      - SMTP_FROM=${SMTP_FROM}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SIKA_ALLOW_PRIVATE_AI_ENDPOINTS=${SIKA_ALLOW_PRIVATE_AI_ENDPOINTS:-false}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - SKIP_DB_AUTO_MIGRATE=${SKIP_DB_AUTO_MIGRATE:-false}
      - DB_MIGRATE_RETRIES=${DB_MIGRATE_RETRIES:-20}
      - DB_MIGRATE_RETRY_DELAY_MS=${DB_MIGRATE_RETRY_DELAY_MS:-2000}
      - SKIP_DB_SCHEMA_CHECK=${SKIP_DB_SCHEMA_CHECK:-false}
      - DB_SCHEMA_CHECK_RETRIES=${DB_SCHEMA_CHECK_RETRIES:-20}
      - DB_SCHEMA_CHECK_RETRY_DELAY_MS=${DB_SCHEMA_CHECK_RETRY_DELAY_MS:-2000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
